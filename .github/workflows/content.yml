# Rebuilds the published JSON from content/*.yaml and fails if docs/ doesn't match,
# so stale or hand-edited JSON never reaches GitHub Pages.
name: Content

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Romaji self-test
        run: python3 tools/romaji.py | tee /dev/stderr | grep -qx ok
      - name: Build content
        run: uv run tools/build.py
      - name: docs/ is up to date
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ is out of date. Run 'uv run tools/build.py' and commit docs/."
            exit 1
          fi
