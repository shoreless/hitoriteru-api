# Key: the headword (also the word's id).
#   furigana: headword with readings in brackets after each kanji run: 自[じ]転[てん]車[しゃ].
#             Omit for kana-only words. Use one bracket for words read as a whole: 今日[きょう].
#   reading:  kana reading (derived from furigana when omitted).
#   pos:      part of speech. glosses: 1–3 English glosses. jlpt: 5 (N5) … 1 (N1).

