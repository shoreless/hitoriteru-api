  min_level: themed
  members: [アクション, コメディ, ホラー, アニメ, 恋愛, 時代劇]
  near_miss:
    ホラー: "belongs with ジャンル; it's a kind of film (怖い is how it feels)"

- id: eigakan
  type: meaning
  label: "映[えい]画[が]館[かん]"
  label_en: the cinema
  rule_en: Things you find at the cinema
  min_level: themed
  members: [チケット, 座席, 売店, ポップコーン, 予告編, 字幕]

- id: eiga_hito
  type: meaning
  label: "人[ひと]"
  label_en: people
  rule_en: People in and behind a film
  min_level: themed
