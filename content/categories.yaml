  min_level: themed
  members: [注射, 検査, 血圧, 体温, 点滴, レントゲン]
  near_miss:
    体温: "belongs with 診察; it contains 体 (body) but it's taking your temperature"

- id: yakkyoku
  type: meaning
  label: "薬[やっ]局[きょく]"
  label_en: pharmacy
  rule_en: What you pick up at the pharmacy
  min_level: themed
  members: [処方箋, 錠剤, 目薬, 塗り薬, 痛み止め, 風邪薬]
  near_miss:
    目薬: "belongs with 薬局; it contains 目 (eye) but it's medicine: eye drops"

- id: janru
  type: meaning
