# Hand-curated categories. Members are headwords from words.yaml.
#   type:       meaning | script | shared_kanji | counter | reading
#   label:      Japanese label, with furigana in the same bracket style as words.yaml.
#   min_level:  lowest content level (5 = N5) the category may appear at.
#   excludes:   category ids that must never share a board with this one.
#   near_miss:  per member, the note shown when it is dropped on the wrong foundation.

- id: tenki
  type: meaning
  label: "天[てん]気[き]"
  label_en: weather
  rule_en: Kinds of weather
  min_level: 5
  members: [雨, 雪, 風, 晴れ, 曇り, 雲, 台風]
  excludes: [shizen]

- id: tabemono
  type: meaning
  label: "食[た]べ物[もの]"
  label_en: food
  rule_en: Things you eat
  min_level: 5
  members: [パン, 肉, 魚, 卵, 野菜, 果物, ご飯, お菓子, 牛肉, 豚肉, 鶏肉, 朝ご飯, 晩ご飯]
  near_miss:
    牛肉: "belongs with 食べ物; it contains 牛 (cow) but it's beef"
    豚肉: "belongs with 食べ物; it contains 豚 (pig) but it's pork"
    朝ご飯: "belongs with 食べ物; it contains 朝 (morning) but it's breakfast"
    晩ご飯: "belongs with 食べ物; it contains 晩 (evening) but it's dinner"

