# Journey levels. Each entry applies from level `from` until the next entry; the last entry repeats forever.
# Every attempt reshuffles, so a level is a difficulty setting, not one fixed deal.
#
#   band:               JLPT band the level draws from: 5 = N5 words only, 4 = N5–N4, 3 = N5–N3, 2 = N4–N2, 1 = N3–N1
#   categories:         categories dealt
#   foundations:        foundation slots (keep below categories so players must finish one to start another)
#   columns:            cards dealt into each tableau column; the rest go to the draw pile
#   words_per_category: [min, max] word cards per category, picked at random for each category
#   slack:              move limit = solver's solution × slack (2.4 relaxed … 1.4 tight)
#
# The curve steps every 3 levels to 15, then every 5; each step adds a category or raises the word range.
# A new band starts smaller than the last one ended, because the new vocabulary is the jump.

- from: 1
  band: 5
  categories: 3
  foundations: 2
  columns: [2, 3, 4, 5]
  words_per_category: [3, 5]
  slack: 2.4

